<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="100%" height="100%">
  <!-- 左侧：工业六边形钛金 T 徽标（适用于深色背景） -->
  <g transform="translate(20, 15)">
    <!-- 外层六边形轮廓 -->
    <polygon points="60,5 115,35 115,95 60,125 5,95 5,35" fill="#374151" stroke="#6B7280" stroke-width="2"/>
    <!-- 内部 CNC 切削质感 -->
    <polygon points="60,20 100,43 100,87 60,110 20,87 20,43" fill="#6B7280"/>
    <!-- 电子蓝切面 -->
    <path d="M20,43 L60,65 L100,43 L100,55 L60,78 L20,55 Z" fill="#38BDF8"/>
    <!-- T 字形核心 -->
    <path d="M45,70 L75,70 L75,110 L45,110 Z" fill="#111827"/>
  </g>
  <!-- 右侧：品牌文字 -->
  <g transform="translate(150, 75)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900" fill="#F9FAFB" letter-spacing="2">TITANIUM</text>
    <text x="245" y="0" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900" fill="#38BDF8">.blog</text>
    <text x="2" y="32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#9CA3AF" letter-spacing="1">THE GLOBAL KNOWLEDGE HUB FOR TITANIUM MANUFACTURING</text>
  </g>
</svg>
